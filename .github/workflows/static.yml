# Deploy the static website to GitHub Pages only when website content changes.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'data/ga4-stats.json'
      - 'scripts/export_ga4.py'
      - '.github/workflows/update-ga4-stats.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
