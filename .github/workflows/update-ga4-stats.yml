name: Update GA4 public statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ga4-public-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-analytics-data google-auth
      - name: Export aggregate GA4 data
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python scripts/export_ga4.py
      - name: Publish refreshed statistics
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data/ga4-stats.json /tmp/ga4-stats.json

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/ga4-stats.json data/ga4-stats.json

            git add data/ga4-stats.json
            if git diff --cached --quiet; then
              echo "Statistics are already up to date."
              exit 0
            fi

            git commit -m "Update public GA4 statistics"
            if git push origin HEAD:main; then
              echo "Statistics published successfully."
              exit 0
            fi

            echo "Remote changed during push; retrying..."
          done

          echo "Failed to publish statistics after 3 attempts."
          exit 1
