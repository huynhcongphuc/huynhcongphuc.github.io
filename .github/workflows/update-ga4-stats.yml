name: Update GA4 public statistics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/export_ga4.py'
      - '.github/workflows/update-ga4-stats.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ga4-public-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-analytics-data google-auth
      - name: Export aggregate and realtime GA4 data
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/export_ga4.py
          python - <<'PY'
          import json
          with open('data/ga4-stats.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('property_id') == '287327003'
          assert 'realtime' in d and 'active_users' in d['realtime'] and 'views' in d['realtime']
          assert 'research_downloads' in d['realtime'], 'Missing realtime research_downloads'
          assert 'research' in d['realtime'], 'Missing realtime research detail list'
          for key in ('today','7d','30d','all'):
              assert key in d.get('periods',{}), f'Missing period {key}'
              assert 'research_downloads' in d['periods'][key], f'Missing research_downloads in {key}'
              assert 'research' in d['periods'][key], f'Missing research detail list in {key}'
          assert isinstance(d.get('daily'), list), 'Missing daily trend list'
          for row in d['daily']:
              for key in ('date','users','views','software_downloads','research_downloads'):
                  assert key in row, f'Missing daily field {key}'
          print('GA4 export OK:', d['updated_at'])
          print('Realtime research:', d['realtime']['research_downloads'], d['realtime']['research'])
          print('7d research:', d['periods']['7d']['research_downloads'], d['periods']['7d']['research'])
          print('Daily trend rows:', len(d['daily']))
          PY
      - name: Publish refreshed statistics only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/ga4-stats.json /tmp/ga4-stats.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/ga4-stats.json data/ga4-stats.json
            git add data/ga4-stats.json
            if git diff --cached --quiet; then
              echo "Statistics are already up to date."
              exit 0
            fi
            git commit -m "Update public GA4 statistics"
            if git push origin HEAD:main; then
              echo "Statistics published successfully."
              exit 0
            fi
            echo "Remote changed during push; retrying..."
          done
          exit 1
